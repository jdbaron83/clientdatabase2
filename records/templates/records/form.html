{% extends "records/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<div class="card">
<form method="post" class="stack">{% csrf_token %}
{{ form.non_field_errors }}{{ form.as_p }}
<div class="actions"><button class="btn">Save</button>{% if back %}<a class="btn secondary" href="{{ back }}">Cancel</a>{% endif %}</div>
</form>
</div>
{% endblock %}
