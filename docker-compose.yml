services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: clientdb
      POSTGRES_USER: clientdb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientdb"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    expose:
      - "8000"
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

  # Serves the app over HTTPS and gets a free Let's Encrypt certificate for DOMAIN automatically.
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
